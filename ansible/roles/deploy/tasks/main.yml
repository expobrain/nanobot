- name: Create nanobot data directory
  become: true
  ansible.builtin.file:
    path: /mnt/config/nanobot
    owner: nanobot
    group: nanobot
    mode: "0750"
    state: directory

- name: Create symlink /home/nanobot -> /mnt/config/nanobot
  become: true
  ansible.builtin.file:
    src: /mnt/config/nanobot
    dest: /home/nanobot
    state: link
    force: true

- name: Create user
  become: true
  ansible.builtin.user:
    name: nanobot
    password: "*"
    home: /mnt/config/nanobot
    create_home: false
  register: user_info

- name: Install envsubst
  become: true
  ansible.builtin.package:
    name: gettext
    state: present

- name: Create groups
  become: true
  ansible.builtin.group:
    name: nanobot
  register: group_info

- name: Copy Docker Compose file
  become: true
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../docker-compose.yml"
    dest: "/home/nanobot/docker-compose.yml"
    owner: nanobot
    group: nanobot
    mode: "0640"

- name: Copy config.json.template
  become: true
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../config.json.template"
    dest: "/home/nanobot/config.json.template"
    owner: nanobot
    group: nanobot
    mode: "0640"

- name: Copy Dockerfile
  become: true
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../Dockerfile"
    dest: "/home/nanobot/Dockerfile"
    owner: nanobot
    group: nanobot
    mode: "0640"

- name: Handle Doppler secrets with cleanup
  block:
    - name: Create temporary file for Doppler secrets
      delegate_to: localhost
      become: false
      ansible.builtin.tempfile:
        state: file
        suffix: .env
      register: temp_env_file

    - name: Extract Doppler secrets to temporary file
      delegate_to: localhost
      become: false
      ansible.builtin.shell:
        cmd: |
          doppler secrets download \
            --no-file \
            --format env > {{ temp_env_file.path }}
      environment:
        DOPPLER_TOKEN: "{{ lookup('env', 'DOPPLER_TOKEN') }}"

    - name: Copy .env file from temporary file
      become: true
      ansible.builtin.copy:
        src: "{{ temp_env_file.path }}"
        dest: "/home/nanobot/.env"
        owner: nanobot
        group: nanobot
        mode: "0640"

    - name: Generate config.json from template
      become: true
      ansible.builtin.shell: |
        set -a
        . /home/nanobot/.env
        set +a
        envsubst < /home/nanobot/config.json.template > /home/nanobot/config.json
        chown nanobot:nanobot /home/nanobot/config.json
      args:
        executable: /bin/bash
        creates: /home/nanobot/config.json

  always:
    - name: Remove temporary .env file
      delegate_to: localhost
      become: false
      ansible.builtin.file:
        path: "{{ temp_env_file.path }}"
        state: absent
      when: temp_env_file.path is defined

- name: Start compose stack
  become: true
  community.docker.docker_compose_v2:
    project_src: /home/nanobot
    remove_orphans: true
    env_files:
      - .env
  environment:
    UID: "{{ user_info.uid }}"
    GID: "{{ group_info.gid }}"
